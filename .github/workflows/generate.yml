name: Generate daily issue

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD); blank uses the current UTC date"
        required: false
        type: string
      additional_stories:
        description: "Stories to append if that date already exists"
        required: true
        default: "3"
        type: string

concurrency:
  group: daily-content-generation
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    environment: daily-hebrew-reading
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install generation dependency
        run: python -m pip install -r requirements.txt
      - name: Generate or append stories
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TARGET_DATE: ${{ inputs.date }}
          ADDITIONAL_STORIES: ${{ inputs.additional_stories || '3' }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m src.generate_issue --date "$TARGET_DATE" --additional-stories "$ADDITIONAL_STORIES"
          else
            python -m src.generate_issue --additional-stories "$ADDITIONAL_STORIES"
          fi
      - name: Validate, test, and build
        run: |
          python -m src.validate_content
          python -m unittest discover -s tests -v
          python -m src.build_site
      - name: Commit generated content
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "content: update ${TARGET_DATE:-$(date -u +%F)} issue"
            git push origin HEAD:master
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: generate-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
